# docker-compose.yml
services:
  mongo:
    image: mongo:7
    container_name: apuestas_mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: apuestas_db
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
      - ./db/mongo/init:/docker-entrypoint-initdb.d:ro
    networks:
      - nameless_proyect

  # Por aquí el resto de servicios? XD

volumes:
  mongo_data:

networks:
  nameless_proyect:
    driver: bridge